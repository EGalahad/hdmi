# @package task

defaults:
  - hdmi-base
  - variant: root-aware-global
  - _self_
  - patches: v1_1
  - override object: omomo-rigid5
  - override motion: g1/omomo-rigid5
  - override observation/command: root_joint

name: G1TrackHDMIOmomoRigid5Depth

command:
  motion_palm_frames: true

sensors:
  head_camera:
    _target_: hdmi_head_camera
    body_name: torso_link
    pos: [0.0576, 0.0175, 0.4299]
    pitch_down_deg: 47.6       # Unitree G1 D435 tilt; 0 = level
    fovy: 58.0
    width: 64
    height: 48
    data_types: [depth, segmentation]

observation:
  head_depth:
    depth:
      _target_: hdmi.head_depth
      sensor_name: head_camera
      cutoff_m: 3.0
      min_depth_m: 0.15
      output_dtype: uint8
  object_category:
    category:
      _target_: hdmi.object_category
  object_motion_progress:
    progress:
      _target_: hdmi.object_motion_progress
