# @package _global_
# Camera-realistic object point cloud + head depth image.
defaults:
  - /algo/ppo/module: large
  - override /algo: hdmi_ppo

exp_name: hdmi-rigid5-pcd-camera-depth-8k
seed: 0
total_iters: 8000
checkpoint_interval: 1000
upload_interval: 1000

algo:
  use_object_pcd: true
  use_depth: true
  pcd_hidden_dims: [32, 64]
  depth_channels: [16, 32, 64]
  depth_kernel_sizes: [5, 3, 3]
  depth_feature_dim: 64
  depth_lr: 3.0e-4
  actor_in_keys: [policy, command, object_pcd_valid]
  normalize_before_sum: true
  object_reward_scale: 1.0
  grad_accum_steps: 1
  value_chunk_size: 16384
